name: Restic Backup
version: "1.2.0"
slug: restic_backup
description: Push Home Assistant backups from /backup to a restic REST server
arch:
  - aarch64
  - amd64
startup: once
boot: manual
init: false
homeassistant_api: true
map:
  - type: backup
    read_only: true
backup_exclude:
  - "cache"
options:
  repository: ""
  password: ""
  rest_username: ""
  rest_password: ""
  run_check: false
  notify_service: "script.benachrichtigung"
schema:
  repository: str
  password: password
  rest_username: str?
  rest_password: password?
  run_check: bool
  notify_service: str?
